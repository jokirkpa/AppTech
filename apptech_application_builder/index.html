<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppTech Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #04132d;
      color: #d0e4f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────── */
    .dashboard-header {
      background: linear-gradient(180deg, #061847 0%, #04132d 100%);
      padding: 10px 40px;
      border-bottom: 1px solid #1b3b6f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left h1 {
      color: #069494;
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .header-left p {
      color: #777;
      font-size: 13px;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header-btn {
      background: #061847;
      color: #069494;
      border: 1px solid #1b3b6f;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-btn:hover {
      background: #0a2148;
      border-color: #069494;
    }

    /* ── Body ─────────────────────────────────────────────── */
    .builder-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #03102a;
      border-right: 1px solid #1b3b6f;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 16px;
      gap: 20px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555f7a;
      font-weight: 600;
      padding-bottom: 4px;
      border-bottom: 1px solid #1b3b6f;
    }

    /* Slot buttons */
    .slot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .slot-btn {
      background: linear-gradient(135deg, #1a3a6b 0%, #0d2548 100%);
      color: #a0c4e8;
      border: 1px solid #2d5aa0;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .slot-btn:hover {
      border-color: #069494;
      color: #069494;
    }
    .slot-btn.active {
      border-color: #069494;
      background: linear-gradient(135deg, #093636 0%, #04132d 100%);
      color: #069494;
      font-weight: 600;
    }

    /* Metadata inputs */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-group label {
      font-size: 11px;
      color: #7a90b0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .field-group input {
      background: #0a1f3d;
      border: 1px solid #1b3b6f;
      border-radius: 6px;
      color: #d0e4f7;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }
    .field-group input:focus {
      border-color: #069494;
    }

    /* Action buttons */
    .action-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .btn-save {
      background: linear-gradient(135deg, #055555 0%, #033333 100%);
      color: #4ecdc4;
      border-color: #069494;
    }
    .btn-save:hover {
      background: linear-gradient(135deg, #077777 0%, #055555 100%);
    }
    .btn-save.unsaved {
      border-color: #e0a800;
      box-shadow: 0 0 0 1px #e0a800;
    }
    .btn-preview {
      background: linear-gradient(135deg, #1a3a6b 0%, #0d2548 100%);
      color: #a0c4e8;
      border-color: #2d5aa0;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-preview:hover {
      border-color: #069494;
      color: #069494;
    }

    .save-status {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      transition: color 0.3s;
    }
    .save-status.ok    { color: #4ecdc4; }
    .save-status.error { color: #ff6b6b; }

    /* ── Main editor area ─────────────────────────────────── */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px;
      gap: 10px;
    }
    .editor-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .editor-label {
      font-size: 13px;
      color: #555f7a;
    }
    .slot-indicator {
      font-size: 13px;
      color: #069494;
      font-weight: 600;
    }
    #codeEditor {
      flex: 1;
      background: #0a0a0a;
      color: #c8e6c9;
      border: 1px solid #1b3b6f;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      width: 100%;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    #codeEditor:focus {
      border-color: #069494;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <h1>AppTech Builder</h1>
      <p>Local Application Builder</p>
    </div>
    <div class="header-right">
      <a class="header-btn" href="/preview" target="_blank">👁 Preview Dashboard</a>
    </div>
  </header>

  <!-- Body -->
  <div class="builder-body">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- Active Slot -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Active Slot</div>
        <div class="slot-grid">
          <button class="slot-btn active" data-slot="1" onclick="loadSlot(1)">Test Slot 1</button>
          <button class="slot-btn"        data-slot="2" onclick="loadSlot(2)">Test Slot 2</button>
          <button class="slot-btn"        data-slot="3" onclick="loadSlot(3)">Test Slot 3</button>
          <button class="slot-btn"        data-slot="4" onclick="loadSlot(4)">Test Slot 4</button>
        </div>
      </div>

      <!-- Metadata -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Tool Metadata</div>
        <div class="field-group">
          <label>Tool Name</label>
          <input type="text" id="metaName" placeholder="My Tool" />
        </div>
        <div class="field-group">
          <label>Description</label>
          <input type="text" id="metaDesc" placeholder="What this tool does" />
        </div>
        <div class="field-group">
          <label>Icon (emoji)</label>
          <input type="text" id="metaIcon" placeholder="🧪" maxlength="4" />
        </div>
        <div class="field-group">
          <label>Author</label>
          <input type="text" id="metaAuthor" placeholder="Your name" />
        </div>
      </div>

      <!-- Actions -->
      <div class="sidebar-section">
        <button class="action-btn btn-save" id="saveBtn" onclick="saveSlot()">💾 Save to Slot</button>
        <a class="action-btn btn-preview" href="/preview" target="_blank">👁 Open Preview Dashboard</a>
        <div class="save-status" id="saveStatus"></div>
      </div>

    </aside>

    <!-- Editor -->
    <div class="editor-area">
      <div class="editor-topbar">
        <span class="editor-label">Editing:</span>
        <span class="slot-indicator" id="slotLabel">Test Slot 1</span>
      </div>
      <textarea id="codeEditor" placeholder="&lt;!-- Write your tool HTML here --&gt;"></textarea>
    </div>

  </div>

  <script>
    let currentSlot = 1;
    let metaCache = {};
    let dirty = false;

    const editor    = document.getElementById('codeEditor');
    const saveBtn   = document.getElementById('saveBtn');
    const saveStatus = document.getElementById('saveStatus');

    // Mark as unsaved when editor changes
    editor.addEventListener('input', () => {
      if (!dirty) {
        dirty = true;
        saveBtn.classList.add('unsaved');
        saveBtn.textContent = '💾 Save to Slot (unsaved changes)';
      }
    });

    function setClean() {
      dirty = false;
      saveBtn.classList.remove('unsaved');
      saveBtn.textContent = '💾 Save to Slot';
    }

    async function fetchMeta() {
      try {
        const r = await fetch('/api/meta');
        metaCache = await r.json();
      } catch (e) {
        console.warn('Could not load meta.json', e);
      }
    }

    function applySlotMeta(slot) {
      const m = metaCache[String(slot)] || {};
      document.getElementById('metaName').value   = m.name        || `Test Slot ${slot}`;
      document.getElementById('metaDesc').value   = m.description || '';
      document.getElementById('metaIcon').value   = m.icon        || '🧪';
      document.getElementById('metaAuthor').value = m.author      || '';
    }

    async function loadSlot(slot) {
      currentSlot = slot;

      // Update sidebar buttons
      document.querySelectorAll('.slot-btn').forEach(b => {
        b.classList.toggle('active', Number(b.dataset.slot) === slot);
      });

      // Update slot label
      const m = metaCache[String(slot)] || {};
      document.getElementById('slotLabel').textContent = m.name || `Test Slot ${slot}`;

      // Load metadata inputs
      applySlotMeta(slot);

      // Load HTML content
      try {
        const r = await fetch(`/apps/test${slot}.html`);
        if (r.ok) {
          editor.value = await r.text();
        } else {
          editor.value = '';
        }
      } catch {
        editor.value = '';
      }

      setClean();
      showStatus('');
    }

    async function saveSlot() {
      const slot   = currentSlot;
      const name   = document.getElementById('metaName').value   || `Test Slot ${slot}`;
      const desc   = document.getElementById('metaDesc').value;
      const icon   = document.getElementById('metaIcon').value   || '🧪';
      const author = document.getElementById('metaAuthor').value;
      const content = editor.value;

      showStatus('Saving…');
      try {
        const r = await fetch('/api/save', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ slot, name, description: desc, icon, author, content }),
        });
        const data = await r.json();
        if (data.ok) {
          // Update cache & label
          metaCache[String(slot)] = { name, description: desc, icon, author };
          document.getElementById('slotLabel').textContent = name;
          // Update slot button text
          const btn = document.querySelector(`.slot-btn[data-slot="${slot}"]`);
          if (btn) btn.textContent = `${icon} ${name}`.trim();
          setClean();
          showStatus('Saved!', 'ok');
        } else {
          showStatus('Error: ' + (data.error || 'unknown'), 'error');
        }
      } catch (e) {
        showStatus('Network error', 'error');
      }
    }

    function showStatus(msg, type) {
      saveStatus.textContent = msg;
      saveStatus.className = 'save-status' + (type ? ' ' + type : '');
      if (type === 'ok') {
        setTimeout(() => { saveStatus.textContent = ''; saveStatus.className = 'save-status'; }, 3000);
      }
    }

    // Keyboard shortcut: Ctrl+S / Cmd+S to save
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveSlot();
      }
    });

    // Init
    (async () => {
      await fetchMeta();
      await loadSlot(1);
      // Update slot button labels from meta
      document.querySelectorAll('.slot-btn').forEach(b => {
        const s = b.dataset.slot;
        const m = metaCache[s];
        if (m) b.textContent = `${m.icon || '🧪'} ${m.name || 'Test Slot ' + s}`;
      });
    })();
  </script>

</body>
</html>
