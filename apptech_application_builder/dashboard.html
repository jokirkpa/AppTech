<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppTech Local Builder — Dashboard Preview</title>
    <style>
        /* ============================================================
           This stylesheet is a faithful snapshot of the shared styling
           the live AppTech dashboard provides to every tool. Tools rely
           on these classes existing — do NOT redefine them inside a tool.
           (Kept in sync with templates/dashboard.html on the live site.)
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* No Circuit AI side panel here, so the panel width var is 0. */
        :root { --cpw: 0px; --tool-cols: 3; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background-color: #04132d;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header (title only — no login/settings/tools like the live site) ── */
        .dashboard-header {
            background: linear-gradient(180deg, #061847 0%, #04132d 100%);
            padding: 10px 40px;
            border-bottom: 1px solid #1b3b6f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
            position: relative;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: baseline; gap: 12px; }
        .header-left h1 {
            font-size: 26px;
            color: #069494;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .header-left p { font-size: 13px; color: #777; white-space: nowrap; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .reload-dot {
            font-size: 12px;
            color: #4ecdc4;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .reload-dot::before {
            content: '';
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #2d8659;
            box-shadow: 0 0 6px #2d8659;
        }

        /* ── Body / sidebar / grid ─────────────────────────────────── */
        .dashboard-body {
            flex: 1;
            background:
                radial-gradient(ellipse at top, rgba(4, 159, 217, 0.08) 0%, transparent 55%),
                linear-gradient(135deg, #04132d 0%, #0a2148 50%, #06183a 100%);
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            min-height: 0;
        }

        .tool-sidebar {
            flex: 1 1 auto;
            min-width: 0;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            align-items: safe center;
            justify-content: safe center;
            transition: flex-basis 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(var(--tool-cols, 3), 1fr);
            gap: 20px;
            max-width: calc(var(--tool-cols, 3) * 300px);
            width: 100%;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .tool-card {
            background: linear-gradient(135deg, #2d5aa0 0%, #1a3a6b 100%);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tool-card:hover::before { opacity: 1; }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
        }
        .tool-header { display: flex; align-items: center; gap: 12px; }
        .tool-icon { font-size: 28px; flex-shrink: 0; }
        .tool-title { font-size: 18px; font-weight: bold; color: #fff; line-height: 1.2; }
        .tool-description { font-size: 12px; color: #ccc; line-height: 1.4; }
        .tool-signature {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.22);
            text-align: right;
            margin-top: auto;
            padding-top: 2px;
            letter-spacing: 0.3px;
        }

        .empty-state {
            color: #7a90b0;
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
            max-width: 460px;
        }
        .empty-state code {
            background: #0a1f3d;
            border: 1px solid #1b3b6f;
            border-radius: 4px;
            padding: 2px 6px;
            color: #4ecdc4;
            font-size: 13px;
        }

        /* ── Resize handle + active tool panel ─────────────────────── */
        .active-tool-panel {
            display: none;
            flex: 1 1 auto;
            min-width: 0;
            background-color: #0a1f3d;
            position: relative;
            overflow: hidden;
            flex-direction: column;
        }
        .tool-resize-handle {
            display: none;
            width: 6px;
            background: transparent;
            cursor: ew-resize;
            flex-shrink: 0;
            transition: background 0.2s;
            position: relative;
            z-index: 5;
        }
        .tool-resize-handle:hover,
        .tool-resize-handle.dragging { background: rgba(6, 148, 148, 0.55); }

        body.tool-panel-open .active-tool-panel { display: flex; }
        body.tool-panel-open .tool-resize-handle { display: block; }

        /* Sidebar collapses to icon-only circles when a tool is open */
        body.tool-panel-open .tool-sidebar {
            flex: 0 0 224px;
            padding: 18px 12px;
            align-items: flex-start;
            justify-content: center;
            background-color: #03102a;
            border-right: 1px solid #1b3b6f;
        }
        body.tool-panel-open .tool-grid {
            grid-template-columns: repeat(auto-fill, 56px);
            gap: 14px;
            max-width: none;
            width: 100%;
            justify-content: center;
        }
        body.tool-panel-open .tool-card {
            width: 56px; height: 56px;
            padding: 0;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        body.tool-panel-open .tool-card:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(0, 255, 204, 0.35);
        }
        body.tool-panel-open .tool-card .tool-header { margin: 0; justify-content: center; gap: 0; }
        body.tool-panel-open .tool-card .tool-icon { font-size: 24px; }
        body.tool-panel-open .tool-card .tool-title,
        body.tool-panel-open .tool-card .tool-description,
        body.tool-panel-open .tool-card .tool-signature { display: none; }
        .tool-card.active-tool { box-shadow: 0 0 0 2px #069494, 0 0 18px rgba(6, 148, 148, 0.55); }

        /* ── Shared MODAL styling — the contract every tool depends on ─ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: var(--cpw); bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background-color: #2a2a2a;
            border-radius: 10px;
            max-width: 1000px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, #2d5aa0 0%, #1a3a6b 100%);
            padding: 20px 30px;
            border-radius: 10px 10px 0 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .modal-header h2 {
            grid-column: 2;
            grid-row: 1;
            font-size: 24px;
            color: white;
            text-align: center;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px; height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            transition: background-color 0.2s;
            grid-column: 3;
            grid-row: 1;
            justify-self: end;
        }
        .close-btn:hover { background-color: rgba(255, 255, 255, 0.1); }

        .modal-body { padding: 30px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #555;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }
        .form-group textarea { min-height: 150px; font-family: monospace; resize: vertical; }

        .btn {
            background-color: #2d5aa0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #1a3a6b; }

        .result-box {
            background-color: #1a1a1a;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #aaa; font-weight: bold; }
        .result-value { color: #069494; font-family: monospace; }

        .error-message {
            background-color: #660000;
            color: #ffaaaa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        /* Tabs */
        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            background-color: transparent;
            color: #aaa;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn:hover { color: #069494; background-color: rgba(0, 255, 204, 0.05); }
        .tab-btn.active { color: #069494; border-bottom-color: #069494; background-color: rgba(0, 255, 204, 0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Modal restyle when hosted inside the tool panel (matches live site) */
        .active-tool-panel > .modal {
            width: 100% !important;
            max-width: none !important;
            max-height: none !important;
            height: 100%;
            border-radius: 0;
            box-shadow: none;
            animation: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .active-tool-panel > .modal > .modal-header { border-radius: 0; flex-shrink: 0; }
        .active-tool-panel > .modal > .modal-body { flex: 1; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-left">
            <h1>AppTech</h1>
            <p>Local Builder — Dashboard Preview</p>
        </div>
        <div class="header-right">
            <span class="reload-dot" title="Edits to files in applications/ appear automatically">live reload on</span>
        </div>
    </header>

    <!-- Body -->
    <div class="dashboard-body">
        <div class="tool-sidebar" id="toolSidebar">
            <div class="tool-grid" id="toolGrid"></div>
        </div>
        <div class="tool-resize-handle" id="toolResizeHandle"></div>
        <div class="active-tool-panel" id="activeToolPanel"></div>
    </div>

    <!-- Loaded tool modals live here before being moved into the panel -->
    <div id="dynamicToolContainer" style="display:none;"></div>

    <script>
        // ========================================================================
        // Minimal re-implementation of the live dashboard's tool-panel system.
        // A tool's <div class="modal-overlay"> is fetched, its <style>/<script>
        // injected, and its <div class="modal"> is moved into the active panel.
        // The same openModal / closeModal / _toolOnOpen contract the live site
        // exposes is provided here, so tools behave identically.
        // ========================================================================

        // Open-hook registry: a tool may register window._toolOnOpen[modalId] = fn
        window._toolOnOpen = {};

        let _activeToolId = null;
        const _toolsInFlight = new Set();
        const _loadedTools = new Set();   // modalIds whose HTML is already in the DOM

        // ── Panel show / hide ────────────────────────────────────────────────
        function _showTool(modalId) {
            const overlay = document.getElementById(modalId);
            if (!overlay) return;

            // Close any other open tool first (one active tool at a time).
            if (_activeToolId && _activeToolId !== modalId) _hideTool(_activeToolId);

            const modal = overlay.querySelector('.modal');
            const panel = document.getElementById('activeToolPanel');
            if (modal && panel) {
                panel.appendChild(modal);
                document.body.classList.add('tool-panel-open');
                _activeToolId = modalId;
                document.querySelectorAll('#toolGrid .tool-card.active-tool')
                    .forEach(c => c.classList.remove('active-tool'));
                const card = document.querySelector('#toolGrid [data-tool-id="' + modalId + '"]');
                if (card) card.classList.add('active-tool');
            }
        }

        function _hideTool(modalId) {
            const overlay = document.getElementById(modalId);
            const panel = document.getElementById('activeToolPanel');
            const modal = panel ? panel.querySelector('.modal') : null;
            // Return the modal to its (hidden) overlay so it can be reopened.
            if (modal && overlay) overlay.appendChild(modal);
            if (_activeToolId === modalId) {
                document.body.classList.remove('tool-panel-open');
                _activeToolId = null;
                document.querySelectorAll('#toolGrid .tool-card.active-tool')
                    .forEach(c => c.classList.remove('active-tool'));
            }
        }

        // ── Contract functions every tool can call ───────────────────────────
        function openModal(modalId) {
            _showTool(modalId);
            // Delegate tool-specific open-time init to the tool's own hook.
            window._toolOnOpen?.[modalId]?.();
        }
        function closeModal(modalId) { _hideTool(modalId); }

        // ── Fetch + inject a tool, then open it ───────────────────────────────
        async function loadAndOpenTool(toolFile, modalId) {
            if (document.getElementById(modalId)) { openModal(modalId); return; }
            if (_toolsInFlight.has(modalId)) return;
            _toolsInFlight.add(modalId);
            try {
                const res = await fetch('/applications/' + toolFile, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const html = await res.text();

                // DOMParser handles closing tags inside JS template literals
                // correctly, whereas innerHTML truncates at the first such tag.
                const doc = new DOMParser().parseFromString(html, 'text/html');

                // Inject styles (DOMParser puts them in <head>).
                doc.querySelectorAll('style').forEach(s => {
                    const el = document.createElement('style');
                    el.textContent = s.textContent;
                    el.dataset.toolStyle = modalId;
                    document.head.appendChild(el);
                    s.remove();
                });
                // Execute scripts (DOMParser never runs them automatically).
                doc.querySelectorAll('script').forEach(s => {
                    const el = document.createElement('script');
                    el.textContent = s.textContent;
                    el.dataset.toolScript = modalId;
                    document.head.appendChild(el);
                    s.remove();
                });
                // Move the remaining nodes (the modal-overlay) into the container.
                const container = document.getElementById('dynamicToolContainer');
                while (doc.body.firstChild) container.appendChild(doc.body.firstChild);

                _loadedTools.add(modalId);
                openModal(modalId);
            } catch (err) {
                console.error('Failed to load tool:', err);
                alert('Could not load tool: ' + err.message);
            } finally {
                _toolsInFlight.delete(modalId);
            }
        }

        // Purge an already-injected tool so it can be re-loaded fresh (live reload).
        function _purgeTool(modalId) {
            if (_activeToolId === modalId) _hideTool(modalId);
            document.querySelectorAll('[data-tool-style="' + modalId + '"]').forEach(e => e.remove());
            document.querySelectorAll('[data-tool-script="' + modalId + '"]').forEach(e => e.remove());
            const overlay = document.getElementById(modalId);
            if (overlay) overlay.remove();
            const orphan = document.querySelector('#activeToolPanel > .modal');
            if (orphan && _activeToolId === null) orphan.remove();
            _loadedTools.delete(modalId);
            delete window._toolOnOpen[modalId];
        }

        // ── Render the sidebar cards from the tool list ───────────────────────
        let _renderedKey = '';
        async function renderCards() {
            let tools = [];
            try {
                const res = await fetch('/api/tools/list', { cache: 'no-store' });
                const data = await res.json();
                tools = data.tools || [];
            } catch (e) {
                console.warn('Could not fetch tool list', e);
            }

            const grid = document.getElementById('toolGrid');

            if (!tools.length) {
                grid.innerHTML =
                    '<div class="empty-state">No tools found yet.<br><br>' +
                    'Create a file in <code>applications/</code> (ask Claude to build one), ' +
                    'then it appears here automatically.</div>';
                grid.style.opacity = 1;
                _renderedKey = '';
                return;
            }

            // Only re-render the grid when the set of tools actually changed,
            // so we don't clobber the open tool's active-card highlight.
            const key = tools.map(t => t.id + '|' + t.name + '|' + t.file).join(',,');
            if (key === _renderedKey) return;
            _renderedKey = key;

            grid.innerHTML = '';
            tools.forEach(t => {
                const icon = _leadingEmoji(t.name) || '🛠️';
                const name = _stripLeadingEmoji(t.name);
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.dataset.toolId = t.id;
                if (_activeToolId === t.id) card.classList.add('active-tool');
                card.title = name;
                card.onclick = () => loadAndOpenTool(t.file, t.id);
                card.innerHTML =
                    '<div class="tool-header">' +
                        '<div class="tool-icon">' + icon + '</div>' +
                        '<div class="tool-title">' + _esc(name) + '</div>' +
                    '</div>' +
                    '<div class="tool-description">' + _esc(t.description || '') + '</div>' +
                    (t.author ? '<div class="tool-signature">by ' + _esc(t.author) + '</div>' : '');
                grid.appendChild(card);
            });
            grid.style.opacity = 1;
        }

        // Tools often prefix their name with an emoji; use it as the card icon.
        function _leadingEmoji(s) {
            if (!s) return '';
            const m = s.match(/^\s*(\p{Extended_Pictographic}(?:️)?)/u);
            return m ? m[1] : '';
        }
        function _stripLeadingEmoji(s) {
            return (s || '').replace(/^\s*\p{Extended_Pictographic}️?\s*/u, '').trim() || s;
        }
        function _esc(s) {
            return String(s).replace(/[&<>"]/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // ── Live reload: re-render cards / reopen tool when files change ──────
        let _lastMtime = 0;
        async function pollChanges() {
            try {
                const res = await fetch('/api/changed', { cache: 'no-store' });
                const data = await res.json();
                if (data.mtime && data.mtime !== _lastMtime) {
                    const first = _lastMtime === 0;
                    _lastMtime = data.mtime;
                    if (first) return;   // don't reload on the very first sample
                    const reopen = _activeToolId;
                    // A file changed. Re-render the list; reload the open tool fresh.
                    if (reopen && _loadedTools.has(reopen)) {
                        const tool = await _findTool(reopen);
                        _purgeTool(reopen);
                        _renderedKey = '';
                        await renderCards();
                        if (tool) await loadAndOpenTool(tool.file, tool.id);
                    } else {
                        _renderedKey = '';
                        await renderCards();
                    }
                }
            } catch (e) { /* server momentarily unavailable — ignore */ }
        }
        async function _findTool(modalId) {
            try {
                const res = await fetch('/api/tools/list', { cache: 'no-store' });
                const data = await res.json();
                return (data.tools || []).find(t => t.id === modalId) || null;
            } catch { return null; }
        }

        // ── Sidebar resize handle ─────────────────────────────────────────────
        (function setupResize() {
            const handle = document.getElementById('toolResizeHandle');
            const sidebar = document.getElementById('toolSidebar');
            let dragging = false, startX = 0, startW = 0;
            handle.addEventListener('mousedown', e => {
                dragging = true;
                startX = e.clientX;
                startW = sidebar.getBoundingClientRect().width;
                handle.classList.add('dragging');
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                const w = Math.max(120, Math.min(560, startW + (e.clientX - startX)));
                sidebar.style.flex = '0 0 ' + w + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('dragging');
                document.body.style.userSelect = '';
            });
        })();

        // ── Init ──────────────────────────────────────────────────────────────
        (async () => {
            await renderCards();
            await pollChanges();       // establish the initial mtime baseline
            setInterval(pollChanges, 1500);
        })();
    </script>
</body>
</html>
