<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppTech Builder — Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #04132d;
      color: #d0e4f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────────────── */
    .dashboard-header {
      background: linear-gradient(180deg, #061847 0%, #04132d 100%);
      padding: 10px 40px;
      border-bottom: 1px solid #1b3b6f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left h1 {
      color: #069494;
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .header-left p {
      color: #777;
      font-size: 13px;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header-btn {
      background: #061847;
      color: #069494;
      border: 1px solid #1b3b6f;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-btn:hover {
      background: #0a2148;
      border-color: #069494;
    }

    /* ── Dashboard body ─────────────────────────────────────── */
    .dashboard-body {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      background:
        radial-gradient(ellipse at top, rgba(4,159,217,0.08) 0%, transparent 55%),
        linear-gradient(135deg, #04132d 0%, #0a2148 50%, #06183a 100%);
      position: relative;
    }

    /* ── Tool sidebar ───────────────────────────────────────── */
    .tool-sidebar {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      align-items: safe center;
      justify-content: safe center;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }

    /* ── Tool cards ─────────────────────────────────────────── */
    .tool-card {
      background: linear-gradient(135deg, #1a4a2e 0%, #0d2d1a 100%);
      border: 1px solid #2d8659;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      user-select: none;
    }
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,255,204,0.3);
    }
    .tool-card.active-tool {
      box-shadow: 0 0 0 2px #069494, 0 0 18px rgba(6,148,148,0.55);
    }

    .tool-icon {
      font-size: 28px;
      line-height: 1;
    }
    .tool-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }
    .tool-description {
      font-size: 12px;
      color: #ccc;
    }
    .tool-signature {
      font-size: 10px;
      color: rgba(255,255,255,0.22);
      text-align: right;
    }

    /* ── Resize handle ──────────────────────────────────────── */
    .tool-resize-handle {
      width: 6px;
      cursor: ew-resize;
      background: transparent;
      flex-shrink: 0;
      display: none;
      transition: background 0.15s;
    }
    .tool-resize-handle:hover {
      background: rgba(6,148,148,0.55);
    }

    /* ── Active tool panel ──────────────────────────────────── */
    .active-tool-panel {
      display: none;
      flex: 1 1 auto;
      background: #0a1f3d;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .panel-header {
      background: #061847;
      border-bottom: 1px solid #1b3b6f;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-title {
      color: #069494;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .panel-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: #055555;
      color: #4ecdc4;
      border: 1px solid #069494;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .panel-close-btn:hover {
      background: #077777;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
      padding: 0;
    }

    /* ── Panel-open state ───────────────────────────────────── */
    body.tool-panel-open .active-tool-panel {
      display: flex;
    }
    body.tool-panel-open .tool-resize-handle {
      display: block;
    }
    body.tool-panel-open .tool-sidebar {
      flex: 0 0 224px;
      padding: 18px 12px;
      background: #03102a;
      border-right: 1px solid #1b3b6f;
    }
    body.tool-panel-open .tool-grid {
      grid-template-columns: repeat(auto-fill, 56px);
      gap: 14px;
    }
    body.tool-panel-open .tool-card {
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.tool-panel-open .tool-card:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(0,255,204,0.3);
    }
    body.tool-panel-open .tool-card .tool-title,
    body.tool-panel-open .tool-card .tool-description,
    body.tool-panel-open .tool-card .tool-signature {
      display: none;
    }
    body.tool-panel-open .tool-card .tool-icon {
      font-size: 24px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <h1>AppTech Builder</h1>
      <p>Preview Mode</p>
    </div>
    <div class="header-right">
      <a class="header-btn" href="/" target="_self">← Back to Builder</a>
    </div>
  </header>

  <!-- Dashboard body -->
  <div class="dashboard-body" id="dashboardBody">

    <!-- Tool sidebar -->
    <div class="tool-sidebar" id="toolSidebar">
      <div class="tool-grid" id="toolGrid">

        <!-- Cards are generated by JS from meta.json, but we provide static markup too -->
        <div class="tool-card" id="card-1" data-slot="1" onclick="toggleTool(1)">
          <div class="tool-icon" id="icon-1">🧪</div>
          <div class="tool-title" id="title-1">Test Slot 1</div>
          <div class="tool-description" id="desc-1">Test tool 1</div>
          <div class="tool-signature" id="sig-1"></div>
        </div>

        <div class="tool-card" id="card-2" data-slot="2" onclick="toggleTool(2)">
          <div class="tool-icon" id="icon-2">🧪</div>
          <div class="tool-title" id="title-2">Test Slot 2</div>
          <div class="tool-description" id="desc-2">Test tool 2</div>
          <div class="tool-signature" id="sig-2"></div>
        </div>

        <div class="tool-card" id="card-3" data-slot="3" onclick="toggleTool(3)">
          <div class="tool-icon" id="icon-3">🧪</div>
          <div class="tool-title" id="title-3">Test Slot 3</div>
          <div class="tool-description" id="desc-3">Test tool 3</div>
          <div class="tool-signature" id="sig-3"></div>
        </div>

        <div class="tool-card" id="card-4" data-slot="4" onclick="toggleTool(4)">
          <div class="tool-icon" id="icon-4">🧪</div>
          <div class="tool-title" id="title-4">Test Slot 4</div>
          <div class="tool-description" id="desc-4">Test tool 4</div>
          <div class="tool-signature" id="sig-4"></div>
        </div>

      </div>
    </div>

    <!-- Resize handle -->
    <div class="tool-resize-handle" id="toolResizeHandle"></div>

    <!-- Active tool panel -->
    <div class="active-tool-panel" id="activeToolPanel">
      <button class="panel-close-btn" id="panelCloseBtn" onclick="closeTool()">✕ Close</button>
      <div class="panel-content" id="panelContent"></div>
    </div>

  </div>

  <script>
    let activeSlot = null;

    /* ── Meta loading ───────────────────────────────────────── */
    async function loadMeta() {
      try {
        const r = await fetch('/api/meta');
        const meta = await r.json();
        for (let s = 1; s <= 4; s++) {
          const m = meta[String(s)];
          if (!m) continue;
          const el = id => document.getElementById(id + '-' + s);
          if (el('icon'))  el('icon').textContent  = m.icon        || '🧪';
          if (el('title')) el('title').textContent = m.name        || `Test Slot ${s}`;
          if (el('desc'))  el('desc').textContent  = m.description || '';
          if (el('sig'))   el('sig').textContent   = m.author ? `by ${m.author}` : '';
        }
      } catch (e) {
        console.warn('Could not load meta', e);
      }
    }

    /* ── Tool toggle ────────────────────────────────────────── */
    async function toggleTool(slot) {
      if (activeSlot === slot) {
        closeTool();
        return;
      }
      await openTool(slot);
    }

    async function openTool(slot) {
      activeSlot = slot;

      // Clear previous active
      document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active-tool'));
      document.getElementById('card-' + slot).classList.add('active-tool');

      // Open panel
      document.body.classList.add('tool-panel-open');

      // Load content
      const panel = document.getElementById('panelContent');
      panel.innerHTML = '<div style="padding:20px;color:#555f7a;">Loading…</div>';

      try {
        const r = await fetch(`/apps/test${slot}.html`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const html = await r.text();
        injectHTML(panel, html);
      } catch (e) {
        panel.innerHTML = `<div style="padding:20px;color:#ff6b6b;">Could not load slot ${slot}: ${e.message}</div>`;
      }
    }

    function closeTool() {
      activeSlot = null;
      document.body.classList.remove('tool-panel-open');
      document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active-tool'));
      document.getElementById('panelContent').innerHTML = '';
    }

    /* ── Script execution in injected HTML ──────────────────── */
    function injectHTML(container, html) {
      // Use a wrapper so we can fish out scripts
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;

      // Collect and remove script tags before appending
      const scripts = Array.from(wrapper.querySelectorAll('script'));
      scripts.forEach(s => s.parentNode.removeChild(s));

      container.innerHTML = '';
      container.appendChild(wrapper);

      // Re-execute each script in order
      scripts.forEach(orig => {
        const fresh = document.createElement('script');
        if (orig.src) {
          fresh.src = orig.src;
        } else {
          fresh.textContent = orig.textContent;
        }
        orig.getAttributeNames().forEach(attr => {
          if (attr !== 'src') fresh.setAttribute(attr, orig.getAttribute(attr));
        });
        document.body.appendChild(fresh);
        // Remove after execution to keep DOM tidy (inline scripts execute synchronously)
        if (!orig.src) fresh.parentNode.removeChild(fresh);
      });
    }

    /* ── Resize handle ──────────────────────────────────────── */
    (function setupResize() {
      const handle  = document.getElementById('toolResizeHandle');
      const sidebar = document.getElementById('toolSidebar');
      let dragging  = false;
      let startX    = 0;
      let startW    = 0;

      handle.addEventListener('mousedown', e => {
        dragging = true;
        startX   = e.clientX;
        startW   = sidebar.getBoundingClientRect().width;
        document.body.style.cursor      = 'ew-resize';
        document.body.style.userSelect  = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const delta  = e.clientX - startX;
        const newW   = Math.max(100, Math.min(600, startW + delta));
        sidebar.style.flexBasis = newW + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        document.body.style.cursor     = '';
        document.body.style.userSelect = '';
      });
    })();

    /* ── Init ───────────────────────────────────────────────── */
    loadMeta();
  </script>

</body>
</html>
